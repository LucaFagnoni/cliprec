[workspace]
resolver = "3"
members = ["crates/*", "xtask", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
publish = false

[workspace.dependencies]
cliprec-core = { path = "crates/cliprec-core" }
cliprec-capture = { path = "crates/cliprec-capture" }
cliprec-encode = { path = "crates/cliprec-encode" }
cliprec-audio = { path = "crates/cliprec-audio" }
cliprec-buffer = { path = "crates/cliprec-buffer" }
cliprec-mux = { path = "crates/cliprec-mux" }

# Versioni fissate: nessun aggiornamento senza un motivo scritto in docs/DECISIONS.md.
windows = "=0.62.2"
wasapi = "=0.26.0"
rubato = "=5.0.1"
flacenc = "=0.5.1"
claxon = "=0.4.3"
rtrb = "=0.4.0"
ffmpeg-the-third = { version = "=6.0.0", default-features = false, features = ["codec", "format", "software-resampling"] }
tray-icon = "=0.26.1"
slint = "=1.18.1"
slint-build = "=1.18.1"
tauri-winrt-notification = "=0.8.1"
auto-launch = "=0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "=1.1.8"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
proptest = "1.12.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# panic resta "unwind": i thread di lavoro girano sotto catch_unwind e il supervisore li riavvia.
panic = "unwind"
