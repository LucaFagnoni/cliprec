# Release di ClipRec su un runner Windows: FFmpeg ridotta (in cache), cartella di distribuzione,
# zip portable con SHA-256, installer Inno Setup e release GitHub v<versione di Cargo.toml>.
# Si avvia a mano: gh workflow run release.yml -f notes="..."
# Niente test: chiedono una GPU con encoder hardware; si lanciano in locale prima di avviarlo.
name: Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: Note della release (Markdown)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      # Le variabili d'ambiente vincono sui percorsi di questo PC in .cargo/config.toml.
      FFMPEG_DIR: ${{ github.workspace }}\third_party\ffmpeg-ridotta
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      GH_TOKEN: ${{ github.token }}
      CARGO_TERM_COLOR: never
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Versione
        id: version
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          # Il codice d'uscita di gh (1 = release assente) diventerebbe quello del passo: si azzera.
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) { throw "la release v$v esiste già" }
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Rust 1.93
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0

      - name: Cache della FFmpeg ridotta
        id: ffmpeg
        uses: actions/cache/restore@v6
        with:
          path: third_party/ffmpeg-ridotta
          key: ffmpeg-ridotta-${{ hashFiles('xtask/src/ridotta.rs', 'scripts/ffmpeg-ridotta.sh') }}

      - name: FFmpeg ridotta (circa 10 minuti)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: cargo xtask ffmpeg-ridotta

      # Salvata subito: un errore nei passi dopo non costringe a ricompilarla.
      - name: Salva la FFmpeg ridotta
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: third_party/ffmpeg-ridotta
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: Distribuzione
        run: cargo xtask dist

      - name: Inno Setup 7.1.0
        run: |
          $exe = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe -OutFile $exe
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw "SHA-256 di Inno Setup: $sha" }
          Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:RUNNER_TEMP\inno" -Wait

      - name: Zip, SHA-256 e installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          Set-Location target\dist
          $zip = "ClipRec-$env:VERSION-portable.zip"
          Compress-Archive -Path ClipRec -DestinationPath $zip -Force
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\$zip.sha256", "$h  $zip`n")
          Set-Location $env:GITHUB_WORKSPACE
          & "$env:RUNNER_TEMP\inno\ISCC.exe" /Qp "/DAppVersion=$env:VERSION" installer\cliprec.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: $LASTEXITCODE" }

      - name: Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $env:NOTES)
          Set-Location target\dist
          gh release create "v$env:VERSION" --target $env:GITHUB_SHA --title "ClipRec $env:VERSION" --notes-file "$env:RUNNER_TEMP\notes.md" `
            "ClipRec-$env:VERSION-Setup.exe" "ClipRec-$env:VERSION-portable.zip" "ClipRec-$env:VERSION-portable.zip.sha256"
